# Publishes a release when a pull request is merged into main AND the version in Sources/IslandCore/Version.swift is one
# that has not been released yet. Nothing else releases: not a push to dev, not opening a pull request, not a push straight
# to main, and not running this by hand on another branch.
#
#   - Build on dev. Raise the version in Sources/IslandCore/Version.swift (and add a "## <version>" section to CHANGELOG.md)
#     whenever you like: it only counts once it is on main.
#   - Open a pull request from dev into main. The CI workflow tests it; nothing is released.
#   - Merge it. The merge is a push to main, this workflow starts, sees a new version that arrived through a merged pull
#     request, builds whatever is on main at that moment and publishes it as that version.
#   - Merge again without raising the version, and the tests run and nothing is published.
#
# The release is made as a draft first and published only when everything has been uploaded, so a failed run never leaves
# a half-made release for anyone (or for Island's own updater) to find.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read   # to see which pull request a commit on main came from

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Running this by hand on another branch (the Run workflow button) must never publish that branch.
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Island is written against a recent Swift, so use the newest Xcode the runner has.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read the version
        id: version
        run: |
          VERSION="$(sed -n 's/.*islandVersion = "\(.*\)".*/\1/p' Sources/IslandCore/Version.swift)"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Sources/IslandCore/Version.swift must say islandVersion = \"MAJOR.MINOR.PATCH\" (found: '$VERSION')"
            exit 1
          fi
          # (Later steps read it as $VERSION in a script, or as steps.version.outputs.version in the workflow itself.)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "This is version $VERSION"

      - name: Is this a new version? (only a new version is released)
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Anything left half-made for this version by an earlier failed run is removed first.
          if isDraft="$(gh release view "v$VERSION" --json isDraft --jq .isDraft 2>/dev/null)" && [ "$isDraft" = "true" ]; then
            echo "Removing a draft left by an earlier failed run"
            gh release delete "v$VERSION" --yes
          fi
          # Versions already released: published releases and tags.
          released="$( { gh release list --limit 200 --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName'; git tag -l 'v*'; } | sort -u )"
          echo "Already released: $(echo $released | tr '\n' ' ')"
          decision="$(.github/scripts/release-decision.sh "$VERSION" $released)"
          echo "Version in the file: $VERSION, so: $decision"
          if [ "$decision" != "release" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Version $VERSION is already released, so nothing is published. To release, raise the version in Sources/IslandCore/Version.swift."
          else
            # A new version is released only when it reached main through a merged pull request, not by a push straight to main.
            how="$(.github/scripts/release-source.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA")"
            echo "This change reached main as: $how"
            case "$how" in
              pull-request*)
                echo "publish=true" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "publish=false" >> "$GITHUB_OUTPUT"
                echo "::notice::Version $VERSION is new, but this change was pushed to main directly instead of being merged from a pull request, so nothing is published. Open a pull request from dev into main and merge it."
                ;;
            esac
          fi

      - name: Test
        run: swift test

      - name: Release notes (from CHANGELOG.md, with the install guide)
        if: steps.decide.outputs.publish == 'true'
        run: .github/scripts/release-notes.sh "$VERSION" > release-notes.md && cat release-notes.md

      - name: Build the universal app and the disk image
        if: steps.decide.outputs.publish == 'true'
        run: scripts/release.sh

      - name: Keep the build with the run
        if: steps.decide.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Island-${{ steps.version.outputs.version }}
          path: |
            dist/Island-*.dmg
            dist/Island-*.dmg.sha256

      - name: Publish the release
        if: steps.decide.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" \
            "dist/Island-$VERSION.dmg" "dist/Island-$VERSION.dmg.sha256" \
            --draft --target "$GITHUB_SHA" --title "Island $VERSION" --notes-file release-notes.md
          gh release edit "v$VERSION" --draft=false --latest
          echo "::notice::Published Island $VERSION: $(gh release view "v$VERSION" --json url --jq .url)"
